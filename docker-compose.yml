services:
  # 1. 向量数据库 Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: unbounded_qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: always

  # 2. 全链路 Trace 日志数据库 MongoDB
  mongodb:
    image: mongo:6.0
    container_name: unbounded_mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo_data:/data/db
    restart: always

  # 3. RAG 反馈数据飞轮 PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: unbounded_postgres
    environment:
      POSTGRES_USER: geop
      POSTGRES_PASSWORD: geop_password
      POSTGRES_DB: unbounded_ai
    ports:
      - "5432:5432"
    volumes:
      - ./data/pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geop -d unbounded_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. 拟人化延迟队列 Redis
  redis:
    image: redis:7.0-alpine
    container_name: unbounded_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
    restart: always
